<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pit — stopped time vs minimum</title>
<style>
  html,body{margin:0;height:100%;background:#fff;font-family:'IBM Plex Mono',ui-monospace,monospace;color:#16202b}
  body{overflow:hidden}
  /* four horizontal pages: STOPS | TARGET | LAST HOUR | MARGINS */
  #wrap{display:flex;width:400%;height:100%;transition:transform .4s cubic-bezier(.55,.06,.2,1)}
  body.p1 #wrap{transform:translateX(-25%)}
  body.p2 #wrap{transform:translateX(-50%)}
  body.p3 #wrap{transform:translateX(-75%)}
  .page{flex:0 0 25%;width:25%;height:100%;display:flex;flex-direction:column;min-height:0}
  .pagehead{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 14px 6px}
  .ptitle{font-size:15px;font-weight:800;letter-spacing:2px}
  /* MARGINS has a back button and nothing on its right: keep the title beside
     the button rather than let space-between throw it at the far edge */
  .pagehead .ptitle:last-child{margin-right:auto}
  .ptitle small{font-size:11px;font-weight:500;letter-spacing:1px;color:#6b7480;margin-left:8px;text-transform:uppercase}
  .navlink{font-family:inherit;font-size:12px;font-weight:700;letter-spacing:1px;color:#16202b;background:#eceff2;border:none;border-radius:8px;padding:8px 12px;cursor:pointer}
  .navlink:hover{background:#dfe4e9}
  .pagebody{flex:1 1 auto;min-height:0;overflow:hidden;padding:0 22px 12px;display:flex;flex-direction:column}

  /* ---- page 1: the stop table ---- */
  .hero{flex:0 0 auto;display:flex;align-items:flex-end;gap:22px;padding:2px 0 12px;border-bottom:2px solid #e3e7eb;margin-bottom:8px}
  .hnum{font-size:52px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-1px}
  .hnum.over{color:#e0301e}.hnum.under{color:#1e8f3a}
  .hlbl{font-size:11px;letter-spacing:2px;color:#6b7480;text-transform:uppercase;font-weight:700;margin-bottom:6px}
  .hsub{font-size:13px;color:#16202b;font-variant-numeric:tabular-nums;margin-bottom:6px}
  .hsub b{font-weight:700}
  /* the position swing is the consequence, so it reads as loud as the seconds */
  .hpos{margin-left:auto;text-align:right;display:flex;align-items:flex-end;gap:26px}
  .hposbig{font-size:52px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-1px;white-space:nowrap}
  .hposbig .to{color:#1e8f3a}
  .hposbig .ar{color:#9aa2ab;font-weight:400;margin:0 4px}
  .hposbig.flat{color:#6b7480;font-size:34px}
  .hpossm{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;color:#6b7480;white-space:nowrap}
  .hpossm .to{color:#1e8f3a}
  .hposnote{font-size:10px;color:#9aa2ab;letter-spacing:.5px;margin-top:5px;font-weight:400}
  .hgain{font-size:11px;letter-spacing:1.5px;color:#1e8f3a;text-transform:uppercase;font-weight:700;margin-top:4px}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  th{font-size:10px;letter-spacing:1.5px;color:#6b7480;text-transform:uppercase;font-weight:700;text-align:right;padding:0 8px 6px;white-space:nowrap}
  th.l,td.l{text-align:left}
  td{font-size:19px;padding:11px 8px;border-top:1px solid #eceff2;white-space:nowrap}
  tr.tot td{border-top:2px solid #16202b;font-weight:800;padding-top:14px}
  .drv{font-size:17px;color:#16202b}
  .drv.same{color:#9aa2ab}
  .marg{font-weight:700}
  /* sign, not consequence: at or over the minimum is legal (green), under it is not (red) */
  .marg.over{color:#1e8f3a}.marg.under{color:#e0301e}
  .est{color:#c78a00;font-size:11px;font-weight:700;letter-spacing:.5px}
  /* the bar: grey = regulation minimum, green overhang = margin over it, red = shortfall */
  td.bar{width:38%;padding-right:0}
  .track{position:relative;height:20px;background:#f2f4f6;border-radius:3px;overflow:hidden}
  .track>.req{position:absolute;left:0;top:0;height:100%;background:#c3c8ce}
  .track>.ovr{position:absolute;top:0;height:100%;background:#1e8f3a}
  .track>.und{position:absolute;top:0;height:100%;background:#e0301e}
  .empty{padding:40px 0;text-align:center;color:#9aa2ab;font-size:14px;line-height:1.7}
  /* Before the first stop the table is the only thing that says what this page
     will show. Print its shape with the row the car is driving towards already
     keyed, rather than a bare "No stops yet." over blank space. */
  tr.ghost td{color:#d3d8dd}
  tr.ghost td.known{color:#16202b}
  .capt{padding:16px 0 0;text-align:center;color:#9aa2ab;font-size:13px;line-height:1.7}

  /* ---- page 2 / 3: lookup tables ---- */
  .live{flex:0 0 auto;display:flex;align-items:center;gap:20px;padding:8px 12px;margin-bottom:8px;border-radius:10px;background:#f6f8fa;border:2px solid #e3e7eb}
  .live.on{background:#eef4ef;border-color:#1e8f3a}
  .live.over{background:#fdeeec;border-color:#e0301e}
  /* the same strip, armed but not running: nothing is being counted yet, so it
     must not wear the green of a live clock */
  .live.next{background:#f6f8fa;border-color:#c3c8ce}
  .cd.idle{color:#9aa2ab}
  .cd{font-size:64px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-1px}
  .cd.go{color:#1e8f3a}.cd.late{color:#e0301e}
  .cdlbl{font-size:10px;letter-spacing:2px;color:#6b7480;text-transform:uppercase;font-weight:700}
  .cdreq{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
  .lut{flex:1 1 auto;min-height:0;overflow:auto}
  .lut table{font-size:18px}
  .lut td,.lut th{padding:9px 10px;text-align:center;border-top:1px solid #f2f4f6}
  .lut tr.hit td{background:#eef4ef;font-weight:800;border-top-color:#1e8f3a}
  .lut tr.hit td:first-child{border-left:3px solid #1e8f3a}
  /* the row the car is heading for, not the one it is standing on -- keyed, but
     in grey so it can never be mistaken for the live minimum */
  .lut tr.hit2 td{background:#f2f4f6;font-weight:700;border-top-color:#c3c8ce}
  .lut tr.hit2 td:first-child{border-left:3px solid #9aa2ab}
  .cols{display:flex;gap:18px;height:100%}
  .cols>div{flex:1 1 0;min-width:0}
  /* All 59 endgame rows must be readable at a glance -- the crew has no hand
     free to scroll. Four columns of 15, on tighter rows, land the whole table
     inside the 700px logical page at the same 18px as the TARGET lookup. */
  .cols td,.cols th{padding:4px 10px}
  .foot{flex:0 0 auto;font-size:11px;color:#9aa2ab;letter-spacing:.5px;padding-top:8px}
  .foot b{color:#6b7480}
  .ovr-in{font-family:inherit;font-size:12px;font-weight:700;width:74px;text-align:right;border:none;border-bottom:1px dashed #9aa2ab;background:transparent;padding:1px 2px}
  .ovr-in:focus{outline:none;background:#eef4ef;border-bottom-color:#1e8f3a}

  /* ---- the in-box countdown, page 1 ---- */
  /* Same .live shell as TARGET, one size down so the stop table still fits under it. */
  .pitcd{gap:16px}
  .pitcd .cd{font-size:46px}
  .calrow{display:flex;align-items:center;gap:8px;margin-top:3px}
  .cal-in{font-family:inherit;font-size:26px;font-weight:800;width:104px;text-align:right;
    font-variant-numeric:tabular-nums;color:#16202b;background:#fff;
    border:2px solid #d7dce1;border-radius:8px;padding:3px 8px}
  .cal-in:focus{outline:none;border-color:#16202b}
  .calbtn{font-family:inherit;font-size:13px;font-weight:800;letter-spacing:1.5px;color:#fff;
    background:#16202b;border:none;border-radius:8px;padding:9px 13px;cursor:pointer}
  .calbtn:hover{background:#2b3948}
  .calbtn.ghost{background:#eceff2;color:#16202b}
  .calbtn.ghost:hover{background:#dfe4e9}
  /* a hand-set clock is not the computed one -- say so wherever the number is shown */
  .calbadge{font-size:10px;letter-spacing:1.5px;font-weight:700;color:#c78a00;text-transform:uppercase}

  /* ---- page 4: the field ---- */
  .cards{flex:0 0 auto;display:flex;gap:12px;margin-bottom:10px}
  .fc{flex:1 1 0;min-width:0;border:2px solid #e3e7eb;border-radius:10px;padding:9px 12px 10px;background:#f9fafb}
  .fc.best{border-color:#1e8f3a;background:#eef4ef}
  .fc.worst{border-color:#e0301e;background:#fdeeec}
  .fc.under{border-color:#e0301e;background:#fdeeec}
  .fcval.under{color:#e0301e}.fcval.over{color:#1e8f3a}
  /* our own car reads as the dark 'self' row does in the list below */
  .fc.self{border-color:#16202b;background:#16202b}
  .fc.self .fclbl,.fc.self .fcsub{color:#9aa2ab}
  .fc.self .fccar,.fc.self .fcval{color:#fff}
  .fclbl{font-size:10px;letter-spacing:1.5px;color:#6b7480;text-transform:uppercase;font-weight:700}
  .fccar{font-size:30px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}
  .fcval{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
  .fcsub{font-size:11px;color:#6b7480;letter-spacing:.3px}
  .flist{flex:1 1 auto;min-height:0;overflow:auto}
  .flist table{font-size:15px}
  .flist td,.flist th{padding:4px 8px;text-align:right;border-top:1px solid #f4f6f8;white-space:nowrap}
  .flist th{font-size:10px;letter-spacing:1.2px;color:#6b7480;text-transform:uppercase;padding-bottom:6px}
  .flist td.l,.flist th.l{text-align:left}
  .flist tr.mine td{background:#eef4ef;font-weight:800}
  .flist tr.mine td:first-child{border-left:3px solid #1e8f3a}
  .flist tr.other td{color:#aeb4bb}
  .flist tr.self td{background:#16202b;color:#fff}
  .flist tr.self td:first-child{border-left:3px solid #16202b}
  /* the list is two short leaderboards now, so each end needs saying out loud */
  .flist tr.sect td{border-top:1px solid #dfe4e9;padding:14px 8px 4px;text-align:left;
    font-size:10px;letter-spacing:1.2px;color:#6b7480;text-transform:uppercase;font-weight:700}
  .flist tr.sect:first-child td{border-top:none;padding-top:2px}
  .mini{position:relative;height:11px;width:150px;background:#f2f4f6;border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle}
  .mini>i{position:absolute;top:0;height:100%}
  .mini>i.p{background:#1e8f3a}.mini>i.n{background:#e0301e}
  .mini>.zero{position:absolute;top:0;height:100%;width:1px;background:#9aa2ab}
  .rep{font-size:10px;font-weight:700;color:#6b7480;letter-spacing:.3px}
</style>
</head>
<body>
<div id="wrap">

  <div class="page" id="pStops">
    <div class="pagehead">
      <span class="ptitle">PIT STOPS<small id="s-car">—</small></span>
      <button type="button" class="navlink" data-go="1">TARGET &#9656;</button>
    </div>
    <div class="pagebody">
      <!-- Static markup, not rebuilt by render(): a half-typed calibration must
           survive the parent's 200ms pushes. Only the text nodes are updated. -->
      <div class="live pitcd" id="s-box" style="display:none">
        <div>
          <div class="cdlbl" id="s-cdlbl">Remaining</div>
          <div class="cd go" id="s-cd">—</div>
        </div>
        <div>
          <div class="cdlbl" id="s-callbl">Calibrate — seconds left on the crew clock</div>
          <div class="calrow">
            <input id="s-cal" class="cal-in" type="text" inputmode="decimal" autocomplete="off" placeholder="s">
            <button type="button" class="calbtn" id="s-sync">SYNC</button>
            <button type="button" class="calbtn ghost" id="s-unsync" style="display:none">DROP</button>
          </div>
        </div>
        <div><div class="cdlbl">Minimum</div><div class="cdreq" id="s-req">—</div></div>
        <div><div class="cdlbl">Table</div><div class="cdreq" id="s-tbl">—</div></div>
        <div><div class="cdlbl" id="s-rellbl">Release at</div><div class="cdreq" id="s-rel">—</div></div>
        <div style="margin-left:auto;text-align:right">
          <div class="cdlbl" id="s-stint">—</div>
          <div style="font-size:12px;color:#6b7480" id="s-note"></div>
        </div>
      </div>
      <div class="hero" id="s-hero"></div>
      <div id="s-table"></div>
    </div>
  </div>

  <div class="page" id="pTarget">
    <div class="pagehead">
      <button type="button" class="navlink" data-go="0">&#9666; STOPS</button>
      <span class="ptitle">TARGET<small>minimum standing time by laps in stint</small></span>
      <button type="button" class="navlink" data-go="2">LAST HOUR &#9656;</button>
    </div>
    <div class="pagebody">
      <div class="live" id="t-live"></div>
      <div class="lut" id="t-lut"></div>
      <div class="foot" id="t-foot"></div>
    </div>
  </div>

  <div class="page" id="pEnd">
    <div class="pagehead">
      <button type="button" class="navlink" data-go="1">&#9666; TARGET</button>
      <span class="ptitle">LAST HOUR<small>last stop — minimum by race time remaining</small></span>
      <button type="button" class="navlink" data-go="3">MARGINS &#9656;</button>
    </div>
    <div class="pagebody">
      <div class="live" id="e-live"></div>
      <div class="lut" id="e-lut"><div class="cols" id="e-cols"></div></div>
      <div class="foot" id="e-foot"></div>
    </div>
  </div>

  <div class="page" id="pField">
    <div class="pagehead">
      <button type="button" class="navlink" data-go="2">&#9666; LAST HOUR</button>
      <span class="ptitle">MARGINS<small id="f-sub">margin against the minimum, every car</small></span>
    </div>
    <div class="pagebody">
      <div class="cards" id="f-cards"></div>
      <div class="flist" id="f-list"></div>
    </div>
  </div>

</div>
<script>
'use strict';
var PAGE=0,R=null;
function goto(i){PAGE=Math.max(0,Math.min(3,i|0));document.body.className=PAGE?('p'+PAGE):'';}
document.querySelectorAll('[data-go]').forEach(function(b){b.addEventListener('click',function(){goto(+b.dataset.go);});});

/* Up/Down belong to the parent's vertical reel; Left/Right step these pages. */
window.addEventListener('keydown',function(e){
  var t=e.target,typing=t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable);
  if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();
    try{window.parent.postMessage({type:'reelV',dir:e.key==='ArrowDown'?1:-1},'*');}catch(err){}}
  else if((e.key==='ArrowLeft'||e.key==='ArrowRight')&&!typing){e.preventDefault();goto(PAGE+(e.key==='ArrowRight'?1:-1));}
});
window.addEventListener('message',function(e){
  var m=e.data;if(!m)return;
  // dir 0 is the parent landing on PIT: back to page one
  if(m.type==='pitH'){if(m.dir===0)goto(0);
                      else goto(PAGE+(m.dir>0?1:-1));return;}
  if(m.type==='pitReport'){R=m;render();return;}
});

var PIT_A=[64,82,101,119,138,156,175,193,212,230];
var PIT_B=PIT_A.map(function(v){return v-8;});
var PIT_C=[28,30,32,34,37,39,41,43,46,48,50,52,55,57,59,61,64,66,68,70,
           73,75,77,79,81,84,86,88,90,93,95,97,99,102,104,106,108,111,113,115,
           117,120,122,124,126,129,131,133,135,137,140,142,144,146,149,151,153,155,158];

function f3(s){var m=Math.floor(s/60),r=s-60*m;return m>0?(m+':'+r.toFixed(3).padStart(6,'0')):r.toFixed(3);}
function f1(s){var neg=s<0;s=Math.abs(s);var m=Math.floor(s/60),r=s-60*m;
  return (neg?'-':'')+(m>0?(m+':'+r.toFixed(1).padStart(4,'0')):r.toFixed(1));}
function sgn(v,d){return (v>=0?'+':'−')+Math.abs(v).toFixed(d==null?1:d);}
function hhmm(t){t=Math.round(t);var h=Math.floor(t/3600)%24,m=Math.floor(t/60)%60,s=t%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');}
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}

/* ---- crew-clock calibration ----------------------------------------------
   The countdown is derived: elapsed runs from the start/finish crossing that
   closed the in-lap, less a fixed pit-entry allowance -- so it is only as good
   as that anchor, and on an estimated (shaky) anchor it can be seconds out.
   The crew's own stopwatch on the box is the truth. SYNC takes the number they
   read off it and makes it lead: we keep a constant offset against the derived
   value, so the calibrated clock still ticks off the same engine (and the same
   SIM play/pause and speed) instead of drifting on a second timer.
   The offset is keyed to this one stop and is dropped the moment the stop ends
   or another car is selected -- a stale hand-set clock is worse than none.

   Waiting for the car to be stationary to do any of that gives the crew about a
   minute, with their hands full. So the same strip is live while the car is on
   TRACK, against the projected next stop: there ARM sets the WINDOW -- the number
   the crew clock will start from and count down. That is a fixed quantity, unlike
   "seconds left", so it can be set a lap early and still be true; it becomes an
   offset only when the stop opens, against the minimum that stop actually draws
   (off = req + margin − window), so a stint that runs a lap longer than projected
   and lands on a different table row still arms correctly. */
var CAL=null;                                   // {key, off} — displayed = derived − off
var PEND=null;                                  // {win} — armed window, waiting for the stop to open
function calKey(){var b=R&&R.inBox;return b?((R.car||'')+'|'+b.lap):null;}
function calOn(){var k=calKey();return !!(CAL&&k&&CAL.key===k);}
function calOff(){return calOn()?CAL.off:0;}
function remNow(){var b=R&&R.inBox;return b?(b.remaining-calOff()):null;}

function doSync(){
  var b=R&&R.inBox,nx=R&&R.next;
  if(!b&&!nx)return;
  var el=document.getElementById('s-cal');
  var v=parseFloat(String(el.value||'').replace(',','.').trim());
  if(!isFinite(v)||v<0){el.focus();el.select();return;}
  if(b)CAL={key:calKey(),off:b.remaining-v};
  else PEND={win:v};                            // banked until the stop opens
  el.blur();paintBox();
}
function dropSync(){CAL=null;PEND=null;document.getElementById('s-cal').value='';paintBox();}
document.getElementById('s-sync').addEventListener('click',doSync);
document.getElementById('s-unsync').addEventListener('click',dropSync);
document.getElementById('s-cal').addEventListener('keydown',function(e){
  if(e.key==='Enter'){e.preventDefault();doSync();}
  else if(e.key==='Escape'){e.preventDefault();e.target.value='';e.target.blur();}
  e.stopPropagation();                          // don't steer the reel while typing
});

/* Text-only repaint of the countdown strip: the calibrate field keeps whatever
   the crew has half-typed into it. */
function paintBox(){
  var box=document.getElementById('s-box'),b=R&&R.inBox,nx=R&&R.next;
  if(!b&&!nx){box.style.display='none';return;}
  box.style.display='';
  if(!b){
    // on track: the clock is not running, so nothing here may tick or read green.
    // The number shown is where the countdown will START -- the armed window if
    // the crew set one, otherwise the projected minimum plus its release margin.
    var win=PEND?PEND.win:(nx.req+(nx.safety||0));
    box.className='live pitcd next';
    var ncd=document.getElementById('s-cd');
    ncd.textContent=win.toFixed(1);
    ncd.className='cd idle';
    document.getElementById('s-cdlbl').innerHTML='Clock will start at'+
      (PEND?' <span class="calbadge">· crew clock</span>':'');
    document.getElementById('s-callbl').textContent='Set the window — crew clock start';
    document.getElementById('s-sync').textContent=PEND?'REARM':'ARM';
    document.getElementById('s-unsync').style.display=PEND?'':'none';
    document.getElementById('s-tbl').textContent=nx.tbl;
    document.getElementById('s-req').textContent=nx.req+'s';
    document.getElementById('s-rellbl').textContent='Stop';
    document.getElementById('s-rel').textContent='#'+nx.n;
    document.getElementById('s-stint').textContent='Lap '+nx.lap+' · '+nx.inStint+' laps in stint';
    document.getElementById('s-note').innerHTML=PEND
      ? '<span class="calbadge">armed — applies when the stop opens</span>'
      : 'if it pits at the end of this lap'+(nx.safety?(' · +'+nx.safety+'s margin'):'');
    return;
  }
  var on=calOn(),rem=b.remaining-(on?CAL.off:0);
  box.className='live pitcd'+(rem<0?' over':' on');
  var cd=document.getElementById('s-cd');
  cd.textContent=(rem<0?'+':'')+Math.abs(rem).toFixed(1);
  cd.className='cd '+(rem<0?'late':'go');
  document.getElementById('s-cdlbl').innerHTML='Remaining'+
    (on?' <span class="calbadge">· crew clock</span>':'');
  document.getElementById('s-callbl').textContent='Calibrate — seconds left on the crew clock';
  document.getElementById('s-unsync').style.display=on?'':'none';
  document.getElementById('s-sync').textContent=on?'RESYNC':'SYNC';
  document.getElementById('s-tbl').textContent=b.tbl;
  document.getElementById('s-req').textContent=b.req+'s';
  document.getElementById('s-rellbl').textContent='Release at';
  document.getElementById('s-rel').textContent=hhmm(b.release-(on?CAL.off:0));
  document.getElementById('s-stint').textContent='In-lap '+b.lap+' · '+b.inStint+' laps';
  document.getElementById('s-note').innerHTML='elapsed '+(b.elapsed+(on?CAL.off:0)).toFixed(1)+'s'+
    (b.safety?(' · +'+b.safety+'s margin'):'')+
    (on?(' · <span class="calbadge">synced '+sgn(-CAL.off)+'s</span>')
       :(b.shaky?' · <span class="est">anchor estimated</span>':''));
}

var CALK=null,CARK=null;
function render(){
  if(!R){return;}
  // another car: everything hand-set belongs to the car it was set on
  if(R.car!==CARK){CARK=R.car;CAL=null;PEND=null;document.getElementById('s-cal').value='';}
  // stop over, or another car: both the offset and whatever is typed in the field
  // belong to that one stop -- a hand-set clock carried into the next is worse than none
  var k=calKey();
  if(k!==CALK){
    CALK=k;CAL=null;
    // the stop just opened on an armed window: convert it against the minimum this
    // stop really drew, so the countdown starts on the crew's number immediately
    if(k&&PEND){CAL={key:k,off:(R.inBox.req+(R.inBox.safety||0))-PEND.win};PEND=null;}
    document.getElementById('s-cal').value='';
  }
  renderStops();renderTarget();renderEnd();renderField();
  paintBox();
}

/* The two ends of the field, ranked by how far each car sat off the minimum.
   Every car's margin is its own stop against its own class table, so the
   numbers are comparable across classes: cards and list rank the same measured
   field, and other classes are listed for reference but visually muted. */
function renderField(){
  var cards=document.getElementById('f-cards'),list=document.getElementById('f-list'),
      sub=document.getElementById('f-sub');
  var F=R.field||[];
  if(!F.length){cards.innerHTML='';list.innerHTML='<div class="empty">No stops in the field yet.</div>';return;}
  var myCls=R.cls||'';
  // Only measured stops can be ranked. A car that sat in the garage for repairs
  // has no pitinfo, so its "stop" is an out-lap-S1 estimate running to tens of
  // minutes -- ranking that as "most time given away" would be nonsense.
  var meas=F.filter(function(x){return x.real;});
  // Except on an event that has no measured stop anywhere: the WIGE live feed
  // carries no stop duration at all, so a live-derived race (NLS7 and every race
  // run off the live feed since) left this ranking empty for all 122 cars and the
  // page showed only the one pinned card. The estimate is the sole stop time that
  // exists there, and it is a good one -- against the 262 NLS6 stops that DO carry
  // a real duration it lands 0.1s off at the median, 6.9s at p90 -- so rank it,
  // and name the scope honestly rather than printing an empty table.
  var EST=!meas.length&&F.length>0,pool=EST?F:meas,SCOPE=EST?'estimated field':'measured field';
  sub.textContent=EST?('cards and list over all '+F.length+' cars · this feed sends no measured stop times')
                     :('cards and list over '+meas.length+' measured of '+F.length+' cars');
  // Ninety-odd rows is a scroll nobody does mid-stint. Only the two ends of the
  // ranking say anything. Cards and list rank the same pool, whichever it is, so
  // a card can never name one car while the rows under the same words name another.
  var srt=pool.slice().sort(function(a,b){return a.m-b.m;});
  // Under and over are two different questions, so they get two different
  // rankings: furthest below the minimum is a penalty to go looking for, but
  // above it the interesting end is the tight one -- the execution to match.
  // Splitting on the sign also means the two ends can never share a car.
  var lo=srt.filter(function(x){return x.m<0;}).slice(0,5),
      hi=srt.filter(function(x){return x.m>=0;}).slice(0,5);
  // The cards are the heads of exactly those two rankings -- nothing else, or a
  // card names one car while the first row printed under the same words names
  // another. Field-wide both times: the margins already carry each car's own
  // class minimum, so the deepest shortfall in the field is the deepest, full
  // stop, and the tightest legal stop is the one to match whoever drove it.
  var closest=hi[0]||null,under=lo[0]||null;
  function card(cls,lbl,x,note){
    if(!x)return '<div class="fc"><div class="fclbl">'+lbl+'</div>'+
      '<div class="fccar" style="color:#c3c8ce">—</div><div class="fcsub">'+note+'</div></div>';
    return '<div class="fc '+cls+'"><div class="fclbl">'+lbl+'</div>'+
      '<div class="fccar">#'+esc(x.car)+'</div>'+
      '<div class="fcval '+(cls==='self'?'':(x.m<0?'under':'over'))+'">'+sgn(x.m)+'s</div>'+
      '<div class="fcsub">'+esc(x.cls)+' · '+x.n+' stop'+(x.n>1?'s':'')+' · '+f1(x.d)+' stopped'+
      (x.rep?(' · '+x.rep+' repair skipped'):'')+'<br>'+note+'</div></div>';
  }
  // Our own car is the reason to read this page at all, and it rarely sits at
  // either end of the ranking. Pin it as a card.
  var own=null;
  if(R.car)F.forEach(function(x){if(x.car===R.car)own=x;});
  cards.innerHTML=
    card('self','Selected car',own,
      own?('our car · '+(own.real?'measured':'stop times estimated'))
         :(R.car?('#'+esc(R.car)+' — no stops yet'):'pick a car on the STOPS page'))+
    card('best','Closest over the minimum in the '+SCOPE,closest,
      closest?('tightest execution · '+SCOPE):'nobody at or over the minimum yet')+
    card('under','Furthest under the minimum in the '+SCOPE,under,
      under?'below its own class table — check for a penalty':'nobody under the minimum');

  // Scale the bars to the rows actually on screen, not to the whole spread: the
  // field's +635s outlier would flatten five margins of twenty-odd seconds into
  // invisible slivers. Our own row is in the set even when it is in neither end.
  var bars=lo.concat(hi);if(own&&(EST||own.real))bars=bars.concat([own]);
  var mx=Math.max.apply(null,(bars.length?bars:F).map(function(x){return Math.abs(x.m);}))||1;
  function row(x){
    var w=Math.min(50,100*Math.abs(x.m)/mx/2), left=x.m>=0?50:(50-w);
    var klass=(x.car===R.car)?'self':(x.cls===myCls?'mine':'other');
    return '<tr class="'+klass+'"><td class="l">#'+esc(x.car)+(x.real?'':' <span class="est">~est</span>')+
      (x.rep?(' <span class="rep">+'+x.rep+' rep</span>'):'')+'</td>'+
      '<td class="l">'+esc(x.cls)+'</td>'+
      '<td>'+x.n+'</td><td>'+f1(x.d)+'</td><td>'+x.r.toFixed(0)+'</td>'+
      // same sign language as the STOPS page: under the minimum is red, at or over it is green
      '<td style="color:'+(klass==='self'?'#fff':(x.m<0?'#e0301e':'#1e8f3a'))+';font-weight:700">'+sgn(x.m)+'</td>'+
      '<td class="l"><span class="mini"><span class="zero" style="left:50%"></span>'+
      '<i class="'+(x.m>=0?'p':'n')+'" style="left:'+left.toFixed(1)+'%;width:'+w.toFixed(1)+'%"></i></span></td></tr>';
  }
  function sect(lbl){return '<tr class="sect"><td colspan="7">'+lbl+'</td></tr>';}
  var h='<table><thead><tr><th class="l">Car</th><th class="l">Class</th><th>Stops</th><th>Stopped</th>'+
    '<th>Minimum</th><th>Margin</th><th class="l">&nbsp;</th></tr></thead><tbody>';
  h+=sect('Furthest under the minimum · '+SCOPE)+
     (lo.length?lo.map(row).join(''):sect(pool.length?'— nobody under the minimum':'— nothing measured yet'));
  if(hi.length)h+=sect('Closest over the minimum · '+SCOPE)+hi.map(row).join('');
  // the two ends are where our car usually is not -- keep it on the page anyway
  var shown={};lo.concat(hi).forEach(function(x){shown[x.car]=1;});
  if(own&&!shown[own.car])h+=sect('Our car')+row(own);
  list.innerHTML=h+'</tbody></table>';
}

function renderStops(){
  var car=document.getElementById('s-car'),hero=document.getElementById('s-hero'),tb=document.getElementById('s-table');
  car.textContent=R.car?('#'+R.car):'—';
  var S=R.stops||[];
  if(!S.length){
    // Nothing measured yet is not nothing to show: print the page it will become,
    // with the first row already carrying whatever the next stop is known to draw.
    // The crew reads where each number will land before it has to read the numbers.
    if(!R.car){
      hero.innerHTML='';
      tb.innerHTML='<div class="empty">Select a car.</div>';
      return;
    }
    var nx=R.next;
    hero.innerHTML='<div><div class="hlbl">Given away</div>'+
        '<div class="hnum" style="color:#d3d8dd">—</div></div>'+
      '<div class="hsub" style="color:#9aa2ab"><b>—</b> actual<br><b>—</b> minimum<br>'+
        '<span>no stops yet</span></div>'+
      '<div class="hpos"><div><div class="hlbl">Position what-if</div>'+
        '<div class="hpossm" style="color:#d3d8dd">—</div>'+
        '<div class="hposnote">how many places the time given away<br>costs — from the first stop on</div></div></div>';
    var kn=nx?' class="known"':'';       // projected cells read as data, blanks stay grey
    var g='<table><thead><tr><th class="l">#</th><th>In-lap</th><th>Laps</th><th>Stopped</th>'+
      '<th class="l">Driver change</th><th>Min req</th><th>Margin</th><th class="l bar">&nbsp;</th></tr></thead><tbody>'+
      '<tr class="ghost"><td class="l known">1</td>'+
      '<td'+kn+'>'+(nx?(nx.lap+' <span class="est">~</span>'):'—')+'</td>'+
      '<td'+kn+'>'+(nx?nx.inStint:'—')+'</td>'+
      '<td>—</td><td class="l">—</td>'+
      '<td'+kn+'>'+(nx?(nx.req+' <span style="color:#9aa2ab;font-size:11px">'+nx.tbl+'</span>'):'—')+'</td>'+
      '<td>—</td>'+
      '<td class="bar"><div class="track">'+
        (nx?'<div class="req" style="width:70%"></div>':'')+'</div></td></tr>'+
      '</tbody></table>';
    tb.innerHTML=g+'<div class="capt">'+(R.live
      ? 'No pit times on this feed.<br><span style="font-size:12px">The WIGE socket carries no pit-in time or stop duration — the row fills from the S/F anchor instead.</span>'
      : (nx?'The first stop fills this row. Grey is projected for a stop at the end of lap '+nx.lap+'.'
          :'The first stop fills this row.'))+'</div>';
    return;
  }
  var totD=0,totR=0,anyEst=false;
  S.forEach(function(s){totD+=s.dur;totR+=s.req;if(!s.real)anyEst=true;});
  var over=totD-totR;
  var scale=Math.max.apply(null,S.map(function(s){return Math.max(s.dur,s.req);}).concat([totD/2]));

  var pos='';
  if(R.whatIf&&R.whatIf.cls){
    var w=R.whatIf,gc=w.cls.now-w.cls.alt,go=w.ovr?(w.ovr.now-w.ovr.alt):0;
    pos='<div class="hpos">'+
      '<div><div class="hlbl">Class</div>'+
        '<div class="hposbig'+(gc?'':' flat')+'">P'+w.cls.now+'<span class="ar">→</span>'+
        (gc?('<span class="to">P'+w.cls.alt+'</span>'):('P'+w.cls.alt))+'</div>'+
        (gc?('<div class="hgain">'+gc+' place'+(gc>1?'s':'')+' back</div>')
           :'<div class="hposnote">no change</div>')+'</div>'+
      (w.ovr?('<div><div class="hlbl">Overall</div>'+
        '<div class="hpossm">P'+w.ovr.now+'<span class="ar">→</span>'+
        (go?('<span class="to">P'+w.ovr.alt+'</span>'):('P'+w.ovr.alt))+'</div>'+
        '<div class="hposnote">static what-if · rivals unchanged<br>ignores traffic &amp; Code-60</div></div>'):'')+
      '</div>';
  }else if(anyEst){
    pos='<div class="hpos"><div><div class="hlbl">Position what-if</div>'+
      '<div class="hpossm" style="color:#c78a00">suppressed</div>'+
      '<div class="hposnote">stop times are estimated —<br>too loose to hang a position on</div></div></div>';
  }
  hero.innerHTML='<div><div class="hlbl">Given away</div><div class="hnum '+(over>=0?'over':'under')+'">'+sgn(over)+'s</div></div>'+
    '<div class="hsub"><b>'+f1(totD)+'</b> actual<br><b>'+f1(totR)+'</b> minimum<br>'+
    '<span style="color:#6b7480">'+S.length+' stop'+(S.length>1?'s':'')+'</span></div>'+pos;

  var h='<table><thead><tr><th class="l">#</th><th>In-lap</th><th>Laps</th><th>Stopped</th>'+
    '<th class="l">Driver change</th><th>Min req</th><th>Margin</th><th class="l bar">&nbsp;</th></tr></thead><tbody>';
  S.forEach(function(s){
    var m=s.dur-s.req,rw=100*Math.min(1,s.req/scale),dw=100*Math.min(1,s.dur/scale);
    var bar='<div class="track"><div class="req" style="width:'+rw.toFixed(1)+'%"></div>'+
      (m>0?'<div class="ovr" style="left:'+rw.toFixed(1)+'%;width:'+Math.max(0,dw-rw).toFixed(1)+'%"></div>'
          :'<div class="und" style="left:'+dw.toFixed(1)+'%;width:'+Math.max(0,rw-dw).toFixed(1)+'%;opacity:.35"></div>')+'</div>';
    h+='<tr><td class="l">'+s.n+'</td><td>'+s.lap+'</td><td>'+s.inStint+'</td>'+
      '<td>'+f3(s.dur)+(s.real?'':' <span class="est">~</span>')+'</td>'+
      '<td class="l drv'+(s.change?'':' same')+'">'+(s.change?(esc(s.from)+' → '+esc(s.to)):(esc(s.to)+' (stays in)'))+'</td>'+
      '<td>'+s.req+' <span style="color:#9aa2ab;font-size:11px">'+s.tbl+'</span></td>'+
      '<td class="marg '+(m>=0?'over':'under')+'">'+sgn(m)+'</td><td class="bar">'+bar+'</td></tr>';
  });
  var tw=100*Math.min(1,totR/ (totD>totR?totD:totR)),tdw=100;
  h+='<tr class="tot"><td class="l">Σ</td><td></td><td></td><td>'+f3(totD)+'</td>'+
    '<td class="l" style="font-size:12px;color:#6b7480">'+(anyEst?'contains estimates':'measured')+'</td>'+
    '<td>'+totR.toFixed(0)+'</td><td class="marg '+(over>=0?'over':'under')+'">'+sgn(over)+'</td>'+
    '<td class="bar"><div class="track"><div class="req" style="width:'+tw.toFixed(1)+'%"></div>'+
    (over>0?'<div class="ovr" style="left:'+tw.toFixed(1)+'%;width:'+(tdw-tw).toFixed(1)+'%"></div>':'')+'</div></td></tr>';
  h+='</tbody></table>';
  tb.innerHTML=h;
}

function renderTarget(){
  var box=document.getElementById('t-live'),lut=document.getElementById('t-lut'),foot=document.getElementById('t-foot');
  var b=R.inBox;
  // one stop, one clock: a SYNC on the STOPS page leads here too
  var on=calOn(),off=calOff(),rem=b?(b.remaining-off):0;
  box.className='live'+(b?(rem<0?' over':' on'):(R.next?' next':''));
  if(b){
    box.innerHTML='<div><div class="cdlbl">Remaining'+
        (on?' <span class="calbadge">· crew clock</span>':'')+'</div><div class="cd '+(rem<0?'late':'go')+'">'+
        (rem<0?'+':'')+Math.abs(rem).toFixed(1)+'</div></div>'+
      '<div><div class="cdlbl">Minimum · table '+b.tbl+'</div><div class="cdreq">'+b.req+'s</div></div>'+
      '<div><div class="cdlbl">Release at</div><div class="cdreq">'+hhmm(b.release-off)+'</div></div>'+
      '<div style="margin-left:auto;text-align:right"><div class="cdlbl">In-lap '+b.lap+' · '+b.inStint+' laps</div>'+
      '<div style="font-size:12px;color:#6b7480">elapsed '+(b.elapsed+off).toFixed(1)+'s'+
      (b.safety?(' · +'+b.safety+'s margin'):'')+
      (on?(' · <span class="calbadge">synced '+sgn(-off)+'s</span>')
         :(b.shaky?' · <span class="est">anchor estimated</span>':''))+'</div></div>';
  }else if(R.next){
    // on track the row still matters -- it is the one the crew is driving towards
    var nx=R.next;
    box.innerHTML='<div><div class="cdlbl">Next stop — projected minimum</div>'+
        '<div class="cd idle">'+nx.req+'s</div></div>'+
      '<div><div class="cdlbl">Table</div><div class="cdreq">'+nx.tbl+'</div></div>'+
      '<div><div class="cdlbl">Stop</div><div class="cdreq">#'+nx.n+'</div></div>'+
      '<div style="margin-left:auto;text-align:right"><div class="cdlbl">On lap '+nx.lap+' · '+nx.inStint+' laps in stint</div>'+
      '<div style="font-size:12px;color:#6b7480">for a stop at the end of this lap — one more lap moves it a row down</div></div>';
  }else{
    box.innerHTML='<div><div class="cdlbl">Car is not in the box</div>'+
      '<div style="font-size:15px;color:#6b7480;margin-top:3px">The clock arms at the start/finish crossing that closes an in-lap.</div></div>';
  }
  // b wins: a running stop is fact, R.next is only a projection
  var nb=(!b&&R.next)?R.next:null;
  var hitLaps=b?b.inStint:(nb?nb.inStint:-1),hitCol=b?b.tbl.charAt(0):(nb?nb.tbl.charAt(0):'');
  var hitCls=b?'hit':'hit2';
  // Inside the last 59 minutes the minimum comes from the LAST HOUR table instead,
  // so nothing here highlights -- say so rather than leave the crew hunting a row.
  var endgame=(hitCol==='C');
  var h='';
  var eg=b||nb;
  if(endgame)h+='<div style="padding:8px 10px;margin-bottom:6px;border-radius:8px;background:#fdf6e6;'+
    'border:2px solid #e8a71e;font-size:15px;font-weight:700">'+(b?'This stop is':'The next stop would be')+
    ' inside the last hour — its '+eg.req+'s minimum comes from the LAST HOUR table (row '+
    eg.tbl.slice(1)+'), not from A/B below.</div>';
  h+='<table><thead><tr><th>Laps in stint</th><th>A — 1st stop</th><th>B — from 2nd</th></tr></thead><tbody>';
  var hitTone=b?'#1e8f3a':'#16202b';
  for(var i=0;i<10;i++){
    var hit=(hitLaps===i+1&&(hitCol==='A'||hitCol==='B'));
    h+='<tr class="'+(hit?hitCls:'')+'"><td>'+(i+1)+'</td>'+
      '<td'+(hit&&hitCol==='A'?' style="color:'+hitTone+'"':'')+'>'+PIT_A[i]+'s</td>'+
      '<td'+(hit&&hitCol==='B'?' style="color:'+hitTone+'"':'')+'>'+PIT_B[i]+'s</td></tr>';
  }
  h+='</tbody></table>';
  lut.innerHTML=h;
  foot.innerHTML='Stints over 10 laps clamp to the 10-lap value. '+
    'Clock anchors to the start/finish crossing less <b>8.42s</b> of pit-lane entry, plus a <b>'+(R.safety||0)+'s</b> release margin.';
}

function renderEnd(){
  var box=document.getElementById('e-live'),cols=document.getElementById('e-cols'),foot=document.getElementById('e-foot');
  var remMin=R.remainMin;
  var hit=(remMin!=null&&remMin>0&&remMin<=59)?Math.ceil(remMin):-1;
  box.className='live'+(hit>0?' on':'');
  box.innerHTML='<div><div class="cdlbl">Race time remaining</div><div class="cdreq">'+
      (remMin==null?'—':(remMin<=0?'finished':f1(remMin*60)))+'</div></div>'+
    (hit>0?('<div><div class="cdlbl">Last-stop minimum</div><div class="cd go" style="font-size:44px">'+PIT_C[hit-1]+'s</div></div>'):
           '<div><div class="cdlbl">Last-hour table</div><div style="font-size:15px;color:#6b7480;margin-top:4px">applies inside the last 59 minutes</div></div>')+
    '<div style="margin-left:auto;text-align:right"><div class="cdlbl">Race ends</div>'+
    '<div style="font-size:15px;font-weight:700">'+(R.raceEnd!=null?hhmm(R.raceEnd):'—')+
    ' <span style="font-size:11px;color:#9aa2ab;font-weight:400">'+esc(R.raceEndSrc||'')+'</span></div></div>';
  var out='';
  for(var c=0;c<4;c++){
    var s='<table><thead><tr><th>Min left</th><th>Minimum</th></tr></thead><tbody>';
    for(var i=c*15;i<Math.min(59,c*15+15);i++){
      var m=i+1;
      s+='<tr class="'+(hit===m?'hit':'')+'"><td>'+m+'</td><td>'+PIT_C[i]+'s</td></tr>';
    }
    out+='<div>'+s+'</tbody></table></div>';
  }
  cols.innerHTML=out;
  foot.innerHTML='Keyed on whole minutes remaining at pit entry, rounded <b>up</b>. '+
    'Race end is read from the schedule; <b>'+esc(R.raceEndSrc||'')+'</b> in use.';
}

/* The countdown must keep ticking between the parent's throttled pushes. */
(function tick(){
  if(R&&R.inBox&&R.playing){
    var b=R.inBox,now=performance.now();
    if(b._t0==null){b._t0=now;b._e0=b.elapsed;}
    var e=b._e0+(now-b._t0)/1000*(R.speed||1);
    b.elapsed=e;b.remaining=b.req+(b.safety||0)-e;
    // a calibrated clock rides the same tick, one constant offset away
    var off=calOff(),rem=b.remaining-off;
    var el=document.querySelector('#t-live .cd');
    if(el){el.textContent=(rem<0?'+':'')+Math.abs(rem).toFixed(1);
      el.className='cd '+(rem<0?'late':'go');
      var lb=document.getElementById('t-live');if(lb)lb.className='live'+(rem<0?' over':' on');}
    var sc=document.getElementById('s-cd');
    if(sc&&document.getElementById('s-box').style.display!=='none'){
      sc.textContent=(rem<0?'+':'')+Math.abs(rem).toFixed(1);
      sc.className='cd '+(rem<0?'late':'go');
      document.getElementById('s-box').className='live pitcd'+(rem<0?' over':' on');}
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
